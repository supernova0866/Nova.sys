name: fit

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace [1] with [0, 1]
        run: sed -i 's/setIntegrationTypes(\[1\])/setIntegrationTypes([0, 1])/g' commands/*.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes" || (git add commands/*.js && git commit -m "chore: fix integration types" && git push)
